<div class="bg-gradient-to-r from-black via-gray-900 to-blue-900 h-screen flex justify-center items-center">
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-8 w-full max-w-md mx-4 shadow-2xl border border-white/20">
        <div class="text-center mb-8">
            <div class="mb-4">
                <i class="fas fa-key text-6xl text-blue-400 mx-auto block"></i>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Forgot Password?</h1>
            <p class="text-gray-300 text-sm">Don't worry, we'll send you reset instructions.</p>
        </div>

        <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <div class="relative">
                <label for="email" class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-envelope text-gray-400"></i>
                    </div>
                    <input type="email" id="email" formControlName="email" placeholder="Enter your email address" class="w-full pl-10 pr-4 py-3 bg-white/5 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200" />
                </div>
                <div *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched" class="mt-2 text-red-400 text-sm">
                    <span *ngIf="forgotPasswordForm.get('email')?.errors?.['required']">Email is required</span>
                    <span *ngIf="forgotPasswordForm.get('email')?.errors?.['email']">Please enter a valid email address</span>
                </div>
            </div>

            <button type="submit" [disabled]="forgotPasswordForm.invalid || isLoading" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 disabled:from-gray-600 disabled:to-gray-700 disabled:cursor-not-allowed text-white font-semibold py-3 px-4 rounded-lg transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98] shadow-lg disabled:transform-none">
                <span *ngIf="!isLoading" class="flex items-center justify-center"> <i class="fas fa-paper-plane mr-2"></i> Send Reset Instructions </span>
                <span *ngIf="isLoading" class="flex items-center justify-center"> <i class="fas fa-spinner fa-spin mr-3"></i> Sending... </span>
            </button>

            <div *ngIf="errorMessage" class="p-4 bg-red-500/20 border border-red-500/50 rounded-lg">
                <div class="flex items-center">
                    <i class="fas fa-exclamation-circle text-red-400 mr-2"></i>
                    <p class="text-red-300 text-sm">{{ errorMessage }}</p>
                </div>
            </div>

                        <div *ngIf="successMessage" class="p-4 bg-green-500/20 border border-green-500/50 rounded-lg">
                <div class="flex items-center">
                    <i class="fas fa-check-circle text-green-400 mr-2"></i>
                    <p class="text-green-300 text-sm">{{successMessage}}</p>
                </div>
            </div>
        </form>

        <div class="mt-8 text-center">
            <a routerLink="/login" class="text-blue-400 hover:text-blue-300 text-sm font-medium transition-colors duration-200 flex items-center justify-center">
                <i class="fas fa-arrow-left mr-2"></i>
                Back to Login
            </a>
        </div>
    </div>
</div>
