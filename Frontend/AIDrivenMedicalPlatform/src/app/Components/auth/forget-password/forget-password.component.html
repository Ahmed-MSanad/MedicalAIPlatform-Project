<div class="bg-gradient-to-r from-black via-gray-900 to-blue-900 h-screen flex justify-center items-center">
    <div class="absolute top-4 z-10"
        [ngClass]="{ 'right-4': currentLanguage !== 'ar', 'left-4': currentLanguage === 'ar' }">
        <div class="relative group" #languageDropdown>
            <button (click)="toggleLanguage()"
                class="flex items-center space-x-2 bg-white/20 backdrop-blur-sm rounded-full px-4 py-2 text-white hover:bg-white/30 transition">
                <i class="fa-solid fa-globe"></i>
                <span class="hidden sm:inline">{{ currentLanguage === 'en' ? 'English' : 'العربية' }}</span>
                <i class="fa-solid fa-chevron-down text-xs transition-transform duration-200"
                    [class.rotate-180]="showLang"></i>
            </button>

            <div class="absolute mt-2 w-40 bg-white rounded-lg shadow-lg overflow-hidden transition-all duration-200 origin-top"
                [ngClass]="{
           'right-0': currentLanguage !== 'ar',
           'left-0': currentLanguage === 'ar',
           'invisible opacity-0 scale-95': !showLang,
           'block': showLang
         }">
                <!-- English Option -->
                <button (click)="switchLanguage('en')"
                    class="block w-full text-left px-4 py-2 hover:bg-gray-100 flex items-center gap-2"
                    [class.bg-blue-100]="currentLanguage === 'en'">
                    <span>English</span>
                </button>

                <!-- Arabic Option (Egyptian Flag) -->
                <button (click)="switchLanguage('ar')"
                    class="block w-full text-left px-4 py-2 hover:bg-gray-100 flex items-center gap-2"
                    [class.bg-blue-100]="currentLanguage === 'ar'">
                    <span>العربية</span>
                </button>
            </div>
        </div>
    </div>
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-8 w-full max-w-md mx-4 shadow-2xl border border-white/20">

        <div class="text-center mb-8">
            <div class="mb-4">
                <i class="fas fa-key text-6xl text-blue-400 mx-auto block"></i>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">{{'forget.Forgot Password?' | translate}}</h1>
            <p class="text-gray-300 text-sm">{{"forget.Don't worry, we'll send you reset instructions." | translate}}
            </p>
        </div>

        <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <div class="relative">
                <label for="email" class="block text-sm font-medium text-gray-300 mb-2">{{'forget.Email Address' |
                    translate}}</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-envelope text-gray-400"></i>
                    </div>
                    <input type="email" id="email" formControlName="email"
                        [placeholder]="'forget.Enter your email address' | translate"
                        class="w-full pl-10 pr-4 py-3 bg-white/5 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200" />
                </div>
                <div *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched"
                    class="mt-2 text-red-400 text-sm">
                    <span *ngIf="forgotPasswordForm.get('email')?.errors?.['required']">{{'forget.Email is required' |
                        translate}}</span>
                    <span *ngIf="forgotPasswordForm.get('email')?.errors?.['email']">{{'forget.Please enter a valid
                        email address' | translate}}</span>
                </div>
            </div>

            <button type="submit" [disabled]="forgotPasswordForm.invalid || isLoading"
                class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 disabled:from-gray-600 disabled:to-gray-700 disabled:cursor-not-allowed text-white font-semibold py-3 px-4 rounded-lg transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98] shadow-lg disabled:transform-none">
                <span *ngIf="!isLoading" class="flex items-center justify-center"> <i
                        class="fas fa-paper-plane mr-2"></i> {{'forget.Send Reset Instructions' | translate}} </span>
                <span *ngIf="isLoading" class="flex items-center justify-center"> <i
                        class="fas fa-spinner fa-spin mr-3"></i> {{'forget.Sending...' | translate}} </span>
            </button>

            <div *ngIf="errorMessage" class="p-4 bg-red-500/20 border border-red-500/50 rounded-lg">
                <div class="flex items-center">
                    <i class="fas fa-exclamation-circle text-red-400 mr-2"></i>
                    <p class="text-red-300 text-sm">{{ errorMessage }}</p>
                </div>
            </div>

            <div *ngIf="successMessage" class="p-4 bg-green-500/20 border border-green-500/50 rounded-lg">
                <div class="flex items-center">
                    <i class="fas fa-check-circle text-green-400 mr-2"></i>
                    <p class="text-green-300 text-sm">{{successMessage}}</p>
                </div>
            </div>
        </form>

        <div class="mt-8 text-center">
            <a routerLink="/login"
                class="text-blue-400 hover:text-blue-300 text-sm font-medium transition-colors duration-200 flex items-center justify-center">
                <i class="fas fa-arrow-left mr-2"></i>
                {{'forget.Back to Login' | translate}}
            </a>
        </div>
    </div>
</div>
