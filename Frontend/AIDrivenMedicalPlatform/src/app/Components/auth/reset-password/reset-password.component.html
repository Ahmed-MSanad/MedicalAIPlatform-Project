<div class="bg-gradient-to-r from-black via-gray-900 to-blue-900 h-screen flex justify-center items-center p-4">
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-8 w-full max-w-md border border-white/20">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-full mb-4">
                <i class="fas fa-lock text-white text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Reset Password</h1>
            <p class="text-gray-300 text-sm">Enter your new password to secure your account</p>
        </div>

        <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <div class="relative">
                <label for="newPassword" class="block text-sm font-medium text-gray-300 mb-2">
                    New Password
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-key text-gray-400"></i>
                    </div>
                    <input id="newPassword" formControlName="newPassword" [type]="showNewPassword ? 'text' : 'password'"
                        class="w-full pl-10 pr-12 py-3 bg-white/5 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
                        placeholder="Enter new password" />
                    <button type="button" (click)="toggleNewPassword()"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-white transition-colors">
                        <i [class]="showNewPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                    </button>
                </div>
                <div *ngIf="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched"
                    class="mt-2 text-red-400 text-sm">
                    <div *ngIf="resetForm.get('newPassword')?.errors?.['required']">
                        <i class="fas fa-exclamation-circle mr-1"></i>
                        New password is required
                    </div>
                    <div *ngIf="resetForm.get('newPassword')?.errors?.['minlength']">
                        <i class="fas fa-exclamation-circle mr-1"></i>
                        Password must be at least 6 characters and has at least 1 special character
                    </div>
                </div>
            </div>

            <div class="relative">
                <label for="confirmPassword" class="block text-sm font-medium text-gray-300 mb-2">
                    Confirm Password
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-shield-alt text-gray-400"></i>
                    </div>
                    <input id="confirmPassword" formControlName="confirmPassword"
                        [type]="showConfirmPassword ? 'text' : 'password'"
                        class="w-full pl-10 pr-12 py-3 bg-white/5 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
                        placeholder="Confirm new password" />
                    <button type="button" (click)="toggleConfirmPassword()"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-white transition-colors">
                        <i [class]="showConfirmPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                    </button>
                </div>
                <div *ngIf="resetForm.get('confirmPassword')?.invalid && resetForm.get('confirmPassword')?.touched"
                    class="mt-2 text-red-400 text-sm">
                    <div *ngIf="resetForm.get('confirmPassword')?.errors?.['required']">
                        <i class="fas fa-exclamation-circle mr-1"></i>
                        Please confirm your password
                    </div>
                </div>
                <div *ngIf="resetForm.errors?.['passwordMismatch'] && resetForm.get('confirmPassword')?.touched"
                    class="mt-2 text-red-400 text-sm">
                    <i class="fas fa-exclamation-circle mr-1"></i>
                    Passwords do not match
                </div>
            </div>

            <div class="space-y-2">
                <div class="text-sm text-gray-300">Password Strength:</div>
                <div class="flex space-x-1">
                    <div [class]="getStrengthBarClass(0)"
                        class="h-2 flex-1 rounded-full transition-colors duration-300"></div>
                    <div [class]="getStrengthBarClass(1)"
                        class="h-2 flex-1 rounded-full transition-colors duration-300"></div>
                    <div [class]="getStrengthBarClass(2)"
                        class="h-2 flex-1 rounded-full transition-colors duration-300"></div>
                    <div [class]="getStrengthBarClass(3)"
                        class="h-2 flex-1 rounded-full transition-colors duration-300"></div>
                </div>
                <div class="text-xs text-gray-400">
                    {{ getPasswordStrengthText() }}
                </div>
            </div>

            <button type="submit" [disabled]="resetForm.invalid || isLoading"
                class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 disabled:from-gray-600 disabled:to-gray-700 disabled:cursor-not-allowed text-white font-semibold py-3 px-6 rounded-lg transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98] shadow-lg">
                <span *ngIf="!isLoading" class="flex items-center justify-center">
                    <i class="fas fa-check-circle mr-2"></i>
                    Reset Password
                </span>
                <span *ngIf="isLoading" class="flex items-center justify-center">
                    <i class="fas fa-spinner fa-spin mr-2"></i>
                    Resetting...
                </span>
            </button>

            <div *ngIf="showSuccess" class="mt-4 p-4 bg-green-500/20 border border-green-500/50 rounded-lg">
                <div class="flex items-center text-green-400">
                    <i class="fas fa-check-circle mr-2"></i>
                    <span class="text-sm">Password reset successfully!</span>
                </div>
            </div>
        </form>

        <div class="mt-8 text-center">
            <button routerLink="/login" class="text-blue-400 hover:text-blue-300 text-sm font-medium transition-colors duration-200">
                <i class="fas fa-arrow-left mr-2"></i>
                Back to Login
            </button>
        </div>
    </div>
</div>
